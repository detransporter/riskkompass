[pytest]
# Scoped to tests/ only -- the repo root's test_*.py files are a separate,
# older convention (standalone scripts, own fail()/print pattern, no
# pytest dependency) and are deliberately left alone, not auto-discovered
# here. See docs/FORECAST_SPEC.md's working agreement and run_tests.sh,
# which runs both suites with one command.
testpaths = tests
