# Tunables for the forecasting module (docs/FORECAST_SPEC.md). Every
# threshold a phase's logic depends on lives here, not hardcoded in
# forecasting/*.py -- so a value can be revisited without hunting through
# code, and so two runs with the same config are the same run.
#
# Phase-numbered sections below track the spec's own phase numbers.
# Only Phase 1's keys are used by code that exists so far.

random_seed: 42

# ── Phase 1: data layer and demand cleaning ─────────────────────────────
data:
  # Aggregation frequency for the demand series data.py builds. pandas
  # offset aliases: "W" (weekly, week ending Sunday), "M" (month end).
  frequency: "W"
  business_calendar_country: "SE"

cleaning:
  # Outlier flag: modified z-score via MAD (median absolute deviation),
  # not a plain std-dev threshold -- intermittent/lumpy demand already has
  # huge natural variance, so std-dev would flag half of every lumpy
  # article's real demand as "outliers". Iglewicz & Hoaglin's commonly
  # cited threshold is 3.5; 6.0 here is deliberately more conservative
  # (fewer false positives) since this flags for human review, not
  # automatic exclusion -- revisit once Phase 2's backtest can show
  # whether excluded/kept outliers actually change accuracy.
  outlier_mad_multiplier: 6.0

  # One-off large order flag: z-score computed on NONZERO periods only
  # (see cleaning.py docstring for why), threshold in standard deviations.
  one_off_z_threshold: 4.0

  # Level shift flag: ratio between a trailing window's mean and the
  # window immediately before it. window is in periods (at `frequency`
  # above); shift_ratio triggers on ratio > shift_ratio OR < 1/shift_ratio
  # (a level shift can go either direction -- demand ramping up or
  # collapsing are both real level shifts, not just the down case that
  # matters for obsolescence detection).
  level_shift_window: 6
  level_shift_ratio: 2.5
  # Both the recent and prior window means must clear this before a ratio
  # is even computed -- a ratio between two near-zero numbers is noise for
  # a low-volume/intermittent article, not a real shift. Found and fixed
  # against the full demo set: without this guard, 99.5% of all 3,000 demo
  # articles got at least one spurious flag (see cleaning.py docstring).
  level_shift_min_window_qty: 1.0

# ── Phase 2: backtest ────────────────────────────────────────────────────
backtest:
  min_train_periods: 8      # fewer periods of history than this: no origin yet, wait
  origin_step: 26            # periods between successive rolling origins (26 weeks = semi-annual --
                              # tuned for runtime on the full 3,000-item demo set: 13 (quarterly)
                              # measured ~8 min for 6 models x 3 horizons, 26 measured ~4 min)
  fixed_horizons: [4, 13, 26]   # weeks, per docs/FORECAST_SPEC.md Phase 2
  review_period_days: 7      # added to an item's lead_time_days for the lead-time-aligned horizon
  season_length: 52          # weeks, for seasonal_naive
  moving_average_window: 8
  ses_alpha: 0.3
  croston_alpha: 0.1
  # Quantiles requested by models: 0.05/0.95 and 0.1/0.9 form the 90%/80%
  # coverage intervals; 0.5/0.8/0.9/0.95 are the pinball-loss quantiles
  # docs/FORECAST_SPEC.md Phase 2 explicitly asks for.
  quantiles: [0.05, 0.1, 0.5, 0.8, 0.9, 0.95]

# ── Phase 5: probabilistic lead-time demand ─────────────────────────────
probabilistic:
  review_period_days: 7
  n_simulations: 1000
  recent_window: 52          # weeks of recent demand history the lead-time-demand
                              # bootstrap draws from -- see probabilistic.py's own
                              # docstring for why this isn't the article's whole history
  min_lead_time_samples: 5   # fewer than this: fall back to review-period-only (no lead-time spread)

# ── Phase 6: policy (safety stock / reorder point / order quantity) ────
policy:
  # Both defaults match CLAUDE.md's own "Inventory Analysis Standards" --
  # not invented for this module, the same numbers already quoted to clients.
  holding_cost_rate: 0.22       # per year, fraction of unit cost
  ordering_cost_sek: 400.0
  abc_service_level: {A: 0.95, B: 0.90, C: 0.85}   # fallback when an item's margin is unknown
  min_critical_ratio: 0.50
  max_critical_ratio: 0.99      # a Monte Carlo distribution can't reliably estimate a tail beyond this
